  <style>
    /* --- Страница галереи --- */
    .works-topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-4) var(--container-pad);
      background: rgba(7, 8, 13, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--color-border);
    }

    .works-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--color-text);
      font-size: var(--size-sm);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: color var(--transition-fast);
    }
    .works-back:hover { color: var(--color-accent); }
    .works-back svg { transition: transform var(--transition-fast); }
    .works-back:hover svg { transform: translateX(-4px); }

    .works-topbar__logo {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      line-height: 1;
      text-decoration: none;
    }
    .works-topbar__name {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.04em;
      color: var(--color-paper);
    }
    .works-topbar__name span { color: var(--color-accent); }
    .works-topbar__ru {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.04em;
      color: var(--color-paper);
    }

    .works-main { padding-block: clamp(var(--space-12), 8vw, var(--space-24)) var(--space-32); }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--space-6);
      margin-top: var(--space-12);
    }

    .gallery-item {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--color-bg-elevated);
      cursor: zoom-in;
      transition: border-color var(--transition-fast), transform var(--transition-fast);
    }
    .gallery-item:hover {
      border-color: var(--color-border-warm);
      transform: translateY(-3px);
    }
    .gallery-item__media {
      aspect-ratio: 4 / 3;
      overflow: hidden;
    }
    .gallery-item__media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .gallery-item:hover .gallery-item__media img { transform: scale(1.05); }
    .gallery-item__cap { padding: var(--space-4) var(--space-6) var(--space-6); }
    .gallery-item__title {
      font-family: var(--font-display);
      font-size: var(--size-md);
      font-weight: 600;
      color: var(--color-paper);
      margin-bottom: 6px;
      line-height: 1.2;
    }
    .gallery-item__meta {
      font-size: var(--size-xs);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* --- Лайтбокс галереи --- */
    .works-lb {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-4);
      background: rgba(4, 5, 9, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .works-lb.is-open { display: flex; }
    .works-lb__img {
      max-width: min(1100px, 94vw);
      max-height: 82vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: var(--radius-md);
    }
    .works-lb__cap {
      position: absolute;
      bottom: var(--space-8);
      left: 0;
      right: 0;
      text-align: center;
      color: var(--color-text);
      font-size: var(--size-sm);
      padding-inline: var(--space-6);
    }
    .works-lb__cap strong { color: var(--color-paper); font-weight: 600; }
    .works-lb__close {
      position: absolute;
      top: var(--space-6);
      right: var(--space-6);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--color-border-warm);
      background: rgba(11, 13, 24, 0.7);
      color: var(--color-paper);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .works-lb__nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--color-border-warm);
      background: rgba(11, 13, 24, 0.7);
      color: var(--color-paper);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .works-lb__nav:hover, .works-lb__close:hover { background: var(--color-accent); color: #0c0906; border-color: transparent; }
    .works-lb__nav--prev { left: clamp(0.5rem, 3vw, 2rem); }
    .works-lb__nav--next { right: clamp(0.5rem, 3vw, 2rem); }

    @media (max-width: 600px) {
      .works-topbar__ru { display: none; }
    }
  </style>

<body class="works-page">

  <div class="cursor-ring" id="cursor-ring" aria-hidden="true"></div>


  <!-- Верхняя панель: назад + лого -->
  <header class="works-topbar">
    <a href="/" class="works-back" aria-label="Вернуться на главную">

      На главную

    </a>
  </header>

  <main class="works-main container">
    <p class="section-index">Портфолио</p>
    <p class="section-label">Наши работы</p>
    <h1 class="section-title">Галерея наших работ</h1>
    <p class="section-subtitle" style="max-width: 620px;">
      Реализованные объекты: ландшафтное освещение, благоустройство территории и автополив.
      Нажмите на фото, чтобы открыть его крупнее.
    </p>

    <div class="gallery-grid" id="gallery-grid" aria-label="Работы Lumoon"></div>
  </main>

  <!-- Плавающие CTA — всегда видимы -->
  <nav class="quick-cta" aria-label="Быстрые действия">
    <a href="/#contact" class="quick-cta__btn quick-cta__btn--accent">
      <span class="quick-cta__label">Заявка</span>
      <span class="quick-cta__dot" aria-hidden="true"></span>
    </a>
    <a href="/#pricing" class="quick-cta__btn">
      <span class="quick-cta__label">Смета</span>
      <span class="quick-cta__dot" aria-hidden="true"></span>
    </a>
  </nav>

  <!-- Лайтбокс -->
  <div class="works-lb" id="works-lb" role="dialog" aria-modal="true" aria-label="Просмотр работы">
    <button class="works-lb__close" id="works-lb-close" type="button" aria-label="Закрыть">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M2 2l14 14M16 2L2 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="works-lb__nav works-lb__nav--prev" id="works-lb-prev" type="button" aria-label="Предыдущее фото">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 4L6 8l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <img class="works-lb__img" id="works-lb-img" src="" alt="" />
    <button class="works-lb__nav works-lb__nav--next" id="works-lb-next" type="button" aria-label="Следующее фото">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <p class="works-lb__cap" id="works-lb-cap"></p>
  </div>

  <script>
    // Работы галереи
    const GALLERY = [
      { src: "assets/portfolio/work-01.jpg",         title: "Вечерняя подсветка загородного сада",              meta: "Ландшафтное освещение · Костромская область" },
      { src: "assets/portfolio/lightbox-extra-01.jpg", title: "Подсветка настила и бамбуковой изгороди",        meta: "Ландшафтное освещение" },
      { src: "assets/portfolio/work-02.jpg",         title: "Ландшафтный дизайн участка с прудами",             meta: "Благоустройство · Ярославская область" },
      { src: "assets/portfolio/work-03.jpg",         title: "Уютная костровая зона для загородного отдыха",     meta: "Благоустройство · Кострома, дер. Кузьмище" },
      { src: "assets/portfolio/osveschenie-path.jpg", title: "Подсветка дорожки из бетонных плит",              meta: "Ландшафтное освещение · Владимирская область" },
      { src: "assets/portfolio/osveschenie-border.jpg", title: "Подсветка клумбы вдоль забора",                 meta: "Ландшафтное освещение · Тверская область" },
      { src: "assets/portfolio/avtopoliv-garden.jpg", title: "Простой и бюджетный автополив на даче",           meta: "Автополив · Нижегородская область" },
      { src: "assets/portfolio/avtopoliv-lawn.jpg",  title: "Автоматический полив газона",                      meta: "Автополив · Ивановская область" },
      { src: "assets/portfolio/dizayn-firepit-2.jpg", title: "Зона отдыха с перголой и подвесными креслами",    meta: "Ландшафтный дизайн · Ярославская область" },
      { src: "assets/portfolio/dizayn-firepit-3.jpg", title: "Угловая скамья с кострищем",                      meta: "Благоустройство · Костромская область" },
      { src: "assets/portfolio/avtopoliv-scheme.jpg", title: "Пример схемы автополива",                         meta: "Автополив · Проектирование" },
      { src: "assets/portfolio/dizayn-plan.jpg",     title: "Пример разбивочного плана участка",                meta: "Ландшафтный дизайн · Проектирование" },
      { src: "assets/portfolio/case-house-lawn.jpg", title: "Загородный дом в вечерней подсветке",              meta: "Ландшафтное освещение · Московская область" },
      { src: "assets/portfolio/case-patio-firepit.jpg", title: "Зона отдыха с очагом рядом с детской площадкой", meta: "Ландшафтное освещение · Московская область" },
    ];

    const grid = document.getElementById("gallery-grid");
    GALLERY.forEach((item, idx) => {
      const el = document.createElement("button");
      el.className = "gallery-item";
      el.type = "button";
      el.setAttribute("aria-label", item.title);
      el.innerHTML = `
        <div class="gallery-item__media">
          <img src="${item.src}" alt="${item.title}" loading="${idx < 2 ? "eager" : "lazy"}" />
        </div>
        <div class="gallery-item__cap">
          <div class="gallery-item__title">${item.title}</div>
          <div class="gallery-item__meta">${item.meta}</div>
        </div>
      `;
      el.addEventListener("click", () => openLb(idx));
      grid.appendChild(el);
    });

    // Лайтбокс
    const lb = document.getElementById("works-lb");
    const lbImg = document.getElementById("works-lb-img");
    const lbCap = document.getElementById("works-lb-cap");
    let lbIndex = 0;

    function renderLb() {
      const item = GALLERY[lbIndex];
      lbImg.src = item.src;
      lbImg.alt = item.title;
      lbCap.innerHTML = `<strong>${item.title}</strong> — ${item.meta}`;
    }
    function openLb(i) {
      lbIndex = i;
      renderLb();
      lb.classList.add("is-open");
      document.body.classList.add("lb-open");
    }
    function closeLb() {
      lb.classList.remove("is-open");
      document.body.classList.remove("lb-open");
    }
    function navLb(dir) {
      lbIndex = (lbIndex + dir + GALLERY.length) % GALLERY.length;
      renderLb();
    }

    document.getElementById("works-lb-close").addEventListener("click", closeLb);
    document.getElementById("works-lb-prev").addEventListener("click", () => navLb(-1));
    document.getElementById("works-lb-next").addEventListener("click", () => navLb(1));
    lb.addEventListener("click", (e) => { if (e.target === lb) closeLb(); });
    document.addEventListener("keydown", (e) => {
      if (!lb.classList.contains("is-open")) return;
      if (e.key === "Escape") closeLb();
      if (e.key === "ArrowLeft") navLb(-1);
      if (e.key === "ArrowRight") navLb(1);
    });
  </script>

  <script src="js/main.js"></script>

</body>
